<footer class="site-footer">
  <p>© {{ .Site.Params.footer.since }}–{{ now.Year }} {{ with .Site.Params.author.homepage }}<a href="{{ . }}" rel="me noopener noreferrer" target="_blank" aria-label="{{ $.Site.Params.name }}（在新窗口打开）">{{ $.Site.Params.name }}</a>{{ else }}{{ .Site.Params.name }}{{ end }} <span aria-hidden="true">·</span> <a href="https://gohugo.io/" rel="noopener noreferrer" target="_blank" aria-label="Hugo（在新窗口打开）">Hugo</a> / Xeu <span aria-hidden="true">·</span> <a href="{{ "index.xml" | relURL }}">RSS</a></p>
  <div class="color-modes" data-appearance role="group" aria-label="外观模式" hidden>
    <button type="button" data-color-mode="light" aria-pressed="true">浅色</button>
    <button type="button" data-color-mode="auto" aria-pressed="false">跟随系统</button>
    <button type="button" data-color-mode="dark" aria-pressed="false">深色</button>
  </div>
</footer>
