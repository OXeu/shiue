{{ if gt .TotalPages 1 }}
{{ $current := .PageNumber }}
<nav class="pagination" aria-label="分页">
  {{ if .HasPrev }}<a class="pagination-step" href="{{ .Prev.URL }}" rel="prev">← 上一页</a>{{ else }}<span class="pagination-step" aria-disabled="true">← 上一页</span>{{ end }}
  <ol class="page-numbers">
    {{ range .Pagers }}
      <li>{{ if eq .PageNumber $current }}<span class="page-number" aria-current="page" aria-label="第 {{ .PageNumber }} 页，当前页">{{ .PageNumber }}</span>{{ else }}<a class="page-number" href="{{ .URL }}" aria-label="第 {{ .PageNumber }} 页">{{ .PageNumber }}</a>{{ end }}</li>
    {{ end }}
  </ol>
  {{ if .HasNext }}<a class="pagination-step" href="{{ .Next.URL }}" rel="next">下一页 →</a>{{ else }}<span class="pagination-step" aria-disabled="true">下一页 →</span>{{ end }}
</nav>
{{ end }}
