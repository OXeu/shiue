<!DOCTYPE html>
<html lang="{{ .Language.Locale | default "zh-CN" }}" data-color-mode="light">
<head>{{ partial "head.html" . }}</head>
<body>
  <a class="skip-link" href="#main">跳至正文</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main{{ if or .IsHome .IsSection (eq .Kind "term") (eq .Params.layout "search") }} site-main--feed{{ end }}" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ $scripts := resources.Get "js/main.js" | js.Build (dict "targetPath" "js/xeu.js" "minify" true "target" "es2020") | fingerprint }}
  <script src="{{ $scripts.RelPermalink }}" integrity="{{ $scripts.Data.Integrity }}" defer></script>
</body>
</html>
