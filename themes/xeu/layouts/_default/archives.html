{{ define "main" }}
  {{ $posts := partial "posts.html" . }}
  <div class="page-heading"><h1>{{ .Title }}</h1><p>共 {{ len $posts }} 篇文章</p></div>
  <div class="timeline">
    {{ range $posts.GroupByDate "2006" }}
    <section class="timeline-year" id="year-{{ .Key }}">
      <h2>{{ .Key }}<span>{{ len .Pages }} 篇文章</span></h2>
      <ul>{{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01/02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
    </section>
    {{ end }}
  </div>
{{ end }}
