{{ define "main" }}
  <header class="page-heading page-heading--terms"><h1>{{ if eq .Section "tags" }}标签{{ else }}分类{{ end }}</h1><p>共 {{ len .Data.Terms }} 个{{ if eq .Section "tags" }}标签{{ else }}分类{{ end }}</p><a href="{{ if eq .Section "tags" }}{{ "categories/" | relURL }}{{ else }}{{ "tags/" | relURL }}{{ end }}">{{ if eq .Section "tags" }}浏览分类{{ else }}浏览标签{{ end }} →</a></header>
  <div class="term-list">
    {{ range .Data.Terms.ByCount }}<a href="{{ .Page.RelPermalink }}"><span><span class="heading-hash">#</span> {{ .Page.Title }}</span><span class="term-count">{{ .Count }} 篇文章</span></a>{{ end }}
  </div>
{{ end }}
