{{- $url := .Destination -}}
{{- if and (strings.HasPrefix $url "/") (not (strings.HasPrefix $url "//")) }}{{ $url = strings.TrimPrefix "/" $url | relURL }}{{ end -}}
<a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if findRE `^https?://` $url }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
