{{- $url := .Destination -}}
{{- if and (strings.HasPrefix $url "/") (not (strings.HasPrefix $url "//")) }}{{ $url = strings.TrimPrefix "/" $url | relURL }}{{ end -}}
{{- $external := findRE `^https?://` $url -}}
<a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener noreferrer" aria-label="{{ .Text | plainify }}（在新窗口打开）"{{ end }}>{{ .Text | safeHTML }}</a>
