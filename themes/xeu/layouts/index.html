{{ define "main" }}
  {{ $posts := partial "posts.html" . }}
  {{ $cards := (.Paginate $posts).Pages }}
  <div class="page-heading"><h1>文章</h1></div>
  <div class="article-list" data-masonry aria-label="文章列表">
    {{ range $index, $page := $cards }}{{ partial "card.html" (dict "page" $page "eager" (eq $index 0) "count" (len $cards)) }}{{ end }}
  </div>
  {{ partial "pagination.html" .Paginator }}
{{ end }}
