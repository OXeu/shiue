name: Hugo 构建

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: 安装构建与维护依赖
        run: npm ci
      - name: 验证评论提交、审批与并发发布
        run: npm run check:comments
      - name: 验证缩略图与 BlurHash 生成
        run: node scripts/check-images.mjs
      - name: 验证最新稳定版 Hugo Extended
        env:
          SHIUE_HUGO_VERSION: latest
          HUGO_BIN: ./scripts/hugo.sh
        run: node scripts/check-build.mjs
